<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passage — browse through a proxy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #DCEBF7;
      --ink: #14213D;
      --muted: #4A5A78;
      --signal: #FFC93C;
      --field: #FFFFFF;
      --line: #A9C4DE;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky: #10203A;
        --ink: #E8F1FA;
        --muted: #9DB2CC;
        --signal: #FFC93C;
        --field: #1A2E4E;
        --line: #2E4A72;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sky);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      width: min(880px, 100% - 2.5rem);
      margin: 0 auto;
      padding: clamp(3rem, 12vh, 8rem) 0 3rem;
    }
    h1 {
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 1.25rem;
      max-width: 12ch;
    }
    .lede {
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--muted);
      max-width: 52ch;
      margin: 0 0 2.5rem;
    }
    form {
      display: flex;
      background: var(--field);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 0.4rem;
      box-shadow: 6px 6px 0 var(--ink);
    }
    input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      padding: 0.9rem 1.2rem;
      outline: none;
    }
    input::placeholder { color: var(--muted); }
    button {
      border: 0;
      border-radius: 999px;
      background: var(--signal);
      color: #14213D;
      font: inherit;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0 1.8rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    form:focus-within { box-shadow: 6px 6px 0 var(--signal); }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .error { color: #C2352B; margin: 1rem 0 0 1.2rem; min-height: 1.4em; }
    @media (prefers-color-scheme: dark) { .error { color: #FF8A80; } }
    .quick { margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .quick span { color: var(--muted); margin-right: 0.4rem; }
    .quick a {
      color: var(--ink);
      text-decoration: none;
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 0.4rem 1rem;
    }
    .quick a:hover, .quick a:focus-visible { border-color: var(--ink); outline: none; }
    footer {
      width: min(880px, 100% - 2.5rem);
      margin: 0 auto;
      padding: 1.5rem 0 2rem;
      color: var(--muted);
      font-size: 0.95rem;
      border-top: 2px solid var(--line);
    }
    @media (max-width: 520px) {
      form { flex-direction: column; border-radius: 1.5rem; gap: 0.4rem; }
      button { padding: 0.9rem; border-radius: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Open any site through Passage</h1>
    <p class="lede">Type a web address and the page loads through this server, so the site sees the proxy’s address instead of yours.</p>

    <form id="go" autocomplete="off">
      <input id="url" type="text" inputmode="url" placeholder="Enter a URL, like wikipedia.org" aria-label="Web address" autofocus>
      <button type="submit">Go</button>
    </form>
    <p class="error" id="error" role="alert"></p>

    <div class="quick">
      <span>Try:</span>
      <a href="/proxy/https://en.wikipedia.org/">Wikipedia</a>
      <a href="/proxy/https://news.ycombinator.com/">Hacker News</a>
      <a href="/proxy/https://duckduckgo.com/html/">DuckDuckGo</a>
    </div>
  </main>
  <footer>Logins and video sites may not work perfectly through a proxy.</footer>

  <script>
    const form = document.getElementById('go');
    const input = document.getElementById('url');
    const error = document.getElementById('error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let value = input.value.trim();
      error.textContent = '';
      if (!value) {
        error.textContent = 'Enter a web address to continue.';
        return;
      }
      // No dot and no protocol? Treat it as a search.
      if (!/^https?:\/\//i.test(value) && !value.includes('.')) {
        value = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(value);
      } else if (!/^https?:\/\//i.test(value)) {
        value = 'https://' + value;
      }
      try {
        new URL(value);
      } catch {
        error.textContent = 'That address doesn’t look right. Check it and try again.';
        return;
      }
      window.location.href = '/proxy/' + value;
    });
  </script>
</body>
</html>
